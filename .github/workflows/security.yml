name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  security-result:
    name: Security Result
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # needed for SARIF upload on public repos
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Detect workflow file changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            workflows:
              - '.github/workflows/**'
      # TruffleHog is used instead of gitleaks/gitleaks-action because gitleaks-action
      # requires a GITLEAKS_LICENSE org secret for GitHub Organisation repos (free tier
      # available but requires registration). TruffleHog has no per-org licensing gate.
      - name: Scan for committed secrets
        uses: trufflesecurity/trufflehog@c85580b712841eda4c53bc28fc6ace6100e8c16c # v3.99.4
        with:
          extra_args: --only-verified
      - name: Audit GitHub Actions workflows
        if: always() && steps.filter.outputs.workflows == 'true'
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          min-severity: medium
          advanced-security: true
          token: ${{ secrets.GITHUB_TOKEN }}
          config: .github/zizmor.yml
