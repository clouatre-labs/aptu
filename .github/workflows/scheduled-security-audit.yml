name: Scheduled Security Audit

# CVE data and Actions security advisories change independent of code commits.
# ci.yml and security.yml checks only run on pull requests and pushes to main.
# This workflow re-runs workflow security audits on a weekly schedule, independent of any diff.

on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  zizmor:
    name: Workflow SHA pinning
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write # needed for SARIF upload on public repos
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # zizmor is run via direct CLI invocation instead of zizmorcore/zizmor-action
      # because zizmorcore is not a verified GitHub creator, which triggers
      # poutine's github_action_from_unverified_creator_used finding.
      # This is the officially documented manual integration pattern:
      # https://docs.zizmor.sh/integrations/#manual-integration
      # zizmor is installed into an isolated venv to avoid PEP 668 issues
      # and to avoid adding any third-party GitHub Actions.
      - name: Install zizmor
        env:
          ZIZMOR_VERSION: "1.29.0"
        run: |
          python -m venv /tmp/zizmor
          /tmp/zizmor/bin/pip install --quiet "zizmor==${ZIZMOR_VERSION}"
      - name: Run zizmor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: /tmp/zizmor/bin/zizmor --min-severity=medium --format=sarif -c .github/zizmor.yml . > zizmor.sarif
      - name: Upload zizmor SARIF results
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        continue-on-error: true
        with:
          sarif_file: zizmor.sarif
          category: zizmor

  poutine:
    name: Workflow audit
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Audit workflow security
        uses: boostsecurityio/poutine-action@e240ebd3eff8b2db5a8e5f6b28f58739d7db2247 # v1.1.4
      - name: Upload poutine SARIF results
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        continue-on-error: true
        with:
          sarif_file: results.sarif
          category: poutine
