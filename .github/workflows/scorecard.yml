name: OpenSSF Scorecard

# Results refresh from the weekly schedule; push-triggered runs measured at
# ~8 redundant runs/week (~29s each) and are not a merge gate.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  scorecard:
    name: Scorecard Analysis
    # OpenSSF Scorecard only supports public repositories.
    # Skip on private/internal repos to avoid GITHUB_TOKEN GraphQL access errors.
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Scorecard CLI
        env:
          VERSION: "5.5.0"
        run: |
          ARCHIVE="scorecard_${VERSION}_linux_arm64.tar.gz"
          curl -fsSL "https://github.com/ossf/scorecard/releases/download/v${VERSION}/${ARCHIVE}" -o "${ARCHIVE}"
          curl -fsSL "https://github.com/ossf/scorecard/releases/download/v${VERSION}/scorecard_checksums.txt" -o scorecard_checksums.txt
          grep " ${ARCHIVE}\$" scorecard_checksums.txt | sha256sum -c -
          tar -xzf "${ARCHIVE}"

      - name: Run OpenSSF Scorecard
        env:
          ENABLE_SARIF: "1"
          GITHUB_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scorecard --repo=github.com/${{ github.repository }} --format=sarif --show-details --policy=.github/scorecard-policy.yml > results.sarif

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        continue-on-error: true
        with:
          sarif_file: results.sarif
